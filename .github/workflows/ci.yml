name: CI

# Runs on PRs into main and on pushes to main. NOTE: GitHub Actions must be
# enabled at the account billing level for this to execute — while billing is
# blocked, runs fail fast with "startup_failure" and no logs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    env:
      # next build statically analyzes pages that read NEXT_PUBLIC_* at module
      # scope (see lib/supabase-config.js assertBrowserSupabaseConfig). CI has no
      # secrets, so provide harmless placeholders; real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://www.tuckertrips.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm is the project's package manager. action-setup reads the exact
      # version from package.json "packageManager" (pnpm@11.5.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # package.json engines: >=22.0.0 <24.0.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational until the codebase is lint-clean. Flip continue-on-error
      # to false (or remove it) to make this a required gate.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      # Informational until the Jest suite is confirmed green. Flip
      # continue-on-error to false to make this a required gate.
      - name: Test
        run: pnpm test
        continue-on-error: true

      # Hard gate: a broken production build must fail CI.
      - name: Build
        run: pnpm build
